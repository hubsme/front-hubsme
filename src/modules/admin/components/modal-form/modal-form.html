<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-fixed-text-950/60 p-2 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out] sm:p-4"
  (click)="handleBackdropClick($event)"
>
  <div
    class="flex max-h-[calc(100dvh-1rem)] w-full min-w-0 flex-col overflow-hidden rounded-2xl bg-surface shadow-2xl ring-1 ring-text/5 animate-[slideUp_0.25s_ease-out] sm:max-h-[90vh]"
    [ngClass]="getMaxWidthClass()"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div
      class="flex shrink-0 items-center justify-between rounded-t-2xl border-b border-border bg-background-50/50 px-4 py-3 sm:px-6 sm:py-4"
    >
      <h2 class="text-xl font-anton lowercase text-text">{{ title() }}</h2>
      <button
        (click)="handleClose()"
        class="w-8 h-8 flex items-center justify-center rounded-full text-text/40 hover:bg-text/5 hover:text-text transition-all duration-200"
      >
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <!-- Custom footer. It is projected before the default slot so it stays outside the scroll body. -->
    <ng-content select="[modalFooter]"></ng-content>

    <!-- Body (Scrollable) -->
    <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-x-hidden overflow-y-auto bg-surface">
      <ng-content></ng-content>
    </div>

    <!-- Footer -->
    @if (showFooter()) {
      <div
        class="flex shrink-0 flex-col-reverse gap-3 rounded-b-2xl border-t border-border bg-background-50/50 px-4 py-3 sm:flex-row sm:items-center sm:justify-end sm:px-6 sm:py-4"
      >
        <button
          type="button"
          (click)="handleClose()"
          class="px-4 py-2 text-sm bg-transparent text-muted rounded-lg font-inter-medium hover:bg-text/5 hover:text-text transition-all duration-200"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          (click)="handleSubmit()"
          [disabled]="loading() || isSubmitting() || submitDisabled()"
          class="px-4 py-2 text-sm rounded-lg font-inter-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-sm hover:shadow-md"
          [ngClass]="getSubmitButtonClass()"
        >
          {{ loading() || isSubmitting() ? 'Guardando...' : submitText() }}
        </button>
      </div>
    }
  </div>
</div>
