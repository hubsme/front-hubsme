@if (!teamsCall.isMinimized() && !teamsCall.isFullscreen()) {
  <!-- Fondo oscuro desenfocado detrás del modal (solo cuando está en modo modal normal) -->
  <div class="fixed inset-0 z-[90] bg-fixed-background-950/60 backdrop-blur-xs animate-in fade-in duration-200"></div>
}

<!-- Contenedor de la llamada. Soporta modal normal y pantalla completa 100% -->
<div 
  class="z-[100] bg-surface shadow-2xl flex flex-col overflow-hidden border border-border transition-all duration-300"
  [class.fixed]="true"
  [class.rounded-2xl]="!teamsCall.isFullscreen()"
  [class.rounded-none]="teamsCall.isFullscreen()"
  
  [class.bottom-4]="teamsCall.isMinimized()"
  [class.right-4]="teamsCall.isMinimized()"
  [class.w-96]="teamsCall.isMinimized()"
  [class.h-80]="teamsCall.isMinimized()"
  
  [class.inset-0]="!teamsCall.isMinimized()"
  [class.m-auto]="!teamsCall.isMinimized() && !teamsCall.isFullscreen()"
  [class.w-full]="!teamsCall.isMinimized()"
  [class.max-w-5xl]="!teamsCall.isMinimized() && !teamsCall.isFullscreen()"
  [class.h-[85vh]]="!teamsCall.isMinimized() && !teamsCall.isFullscreen()"
  
  [class.w-screen]="!teamsCall.isMinimized() && teamsCall.isFullscreen()"
  [class.h-screen]="!teamsCall.isMinimized() && teamsCall.isFullscreen()"
  [class.z-[110]]="teamsCall.isFullscreen()"
>
  <!-- Header de la llamada -->
  <div class="flex items-center justify-between px-4 py-3 border-b border-border bg-background/30 backdrop-blur-md">
    <div class="flex items-center gap-2.5 min-w-0">
      @if (teamsCall.isMinimized()) {
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-success"></span>
        </span>
        <span class="text-xs font-inter-bold text-text-950 truncate">Llamada Activa</span>
      } @else {
        <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
          <i class="fas fa-video"></i>
        </div>
        <span class="text-sm font-inter-bold text-text-950">Sala de Reunión</span>
      }
    </div>

    <!-- Botones de Acción de Cabecera -->
    <div class="flex items-center gap-1.5">
      @if (teamsCall.isMinimized()) {
        <button 
          type="button"
          class="p-1.5 text-muted hover:text-text hover:bg-background/80 rounded-md transition-all cursor-pointer"
          title="Maximizar llamada"
          (click)="teamsCall.maximizeCall()"
        >
          <i class="fas fa-expand-alt text-xs"></i>
        </button>
      } @else {
        <!-- Botón de Pantalla Completa / Restaurar -->
        <button 
          type="button"
          class="p-2 text-muted hover:text-text hover:bg-background/80 rounded-lg transition-all cursor-pointer animate-in fade-in"
          [title]="teamsCall.isFullscreen() ? 'Restaurar tamaño' : 'Pantalla completa'"
          (click)="teamsCall.toggleFullscreen()"
        >
          @if (teamsCall.isFullscreen()) {
            <i class="fas fa-compress text-sm"></i>
          } @else {
            <i class="fas fa-expand text-sm"></i>
          }
        </button>
      }
      <button 
        type="button"
        class="text-danger hover:text-fixed-background-50 hover:bg-danger transition-all cursor-pointer"
        [class.p-2]="!teamsCall.isMinimized()"
        [class.rounded-lg]="!teamsCall.isMinimized()"
        [class.p-1.5]="teamsCall.isMinimized()"
        [class.rounded-md]="teamsCall.isMinimized()"
        title="Cerrar llamada"
        (click)="teamsCall.closeCall()"
      >
        <i class="fas fa-times" [class.text-xs]="teamsCall.isMinimized()" [class.text-sm]="!teamsCall.isMinimized()"></i>
      </button>
    </div>
  </div>

  <!-- Contenedor del Adaptador de ACS/React (Siempre vivo para evitar desconexiones) -->
  <div class="flex-1 min-h-0 relative bg-background/5">
    @if (loading()) {
      <div class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-background/90 gap-4 backdrop-blur-sm">
        <div class="flex items-center justify-center">
          <i class="fas fa-spinner fa-spin text-4xl text-secondary"></i>
        </div>
        <div class="text-center space-y-1">
          <p class="text-base text-text font-inter-bold">Conectando a la sala de Teams...</p>
          <p class="text-xs text-muted font-inter-semibold">Generando credenciales seguras de Azure</p>
        </div>
      </div>
    }
    
    <!-- Contenedor donde React montará la videollamada de Teams -->
    <div #reactContainer class="w-full h-full"></div>
  </div>
</div>
