<div class="relative w-full">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="isOpen()"
    class="flex min-h-12 w-full items-center gap-3 rounded-xl border border-border bg-background-50 px-3 py-2 text-left outline-none transition hover:border-secondary/50 hover:bg-secondary/5 focus:border-secondary focus:ring-4 focus:ring-secondary/10"
    [class.border-secondary]="isOpen()"
    [class.bg-secondary/5]="isOpen()"
  >
    <span
      class="grid size-8 shrink-0 place-items-center rounded-lg bg-secondary/10 text-xs text-secondary"
    >
      <i class="far fa-calendar"></i>
    </span>
    <span class="min-w-0 flex-1">
      @if (selectedOption(); as selected) {
        <span class="block truncate text-xs font-inter-semibold text-text">{{
          selected.dateLabel
        }}</span>
        <span class="mt-0.5 block truncate text-[0.68rem] text-muted">{{
          selected.timeLabel
        }}</span>
      } @else {
        <span class="block text-xs font-inter-semibold text-muted">Seleccionar horario</span>
        <span class="mt-0.5 block text-[0.65rem] text-muted">Esta semana o la siguiente</span>
      }
    </span>
    <i
      class="fas fa-chevron-down shrink-0 text-[0.65rem] text-muted transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    ></i>
  </button>

  @if (isOpen()) {
    <div
      class="absolute left-0 z-50 w-full overflow-hidden rounded-2xl border border-border bg-surface shadow-xl shadow-text/10"
      [class.top-full]="dropdownPosition() === 'down'"
      [class.mt-2]="dropdownPosition() === 'down'"
      [class.bottom-full]="dropdownPosition() === 'up'"
      [class.mb-2]="dropdownPosition() === 'up'"
      role="listbox"
      [attr.aria-label]="ariaLabel()"
    >
      <div class="border-b border-border bg-background-50 px-3 py-2.5">
        <p class="text-xs font-inter-bold text-text">Horarios disponibles</p>
        <p class="mt-0.5 text-[0.65rem] text-muted">Semana actual y próxima</p>
      </div>
      <div class="max-h-64 overflow-y-auto p-2">
        @for (group of groups(); track group.key) {
          <section class="mb-2 last:mb-0">
            <p
              class="px-2 py-1.5 text-[0.65rem] font-inter-bold uppercase tracking-wide text-muted"
            >
              {{ group.label }}
            </p>
            <div class="space-y-1">
              @for (option of group.options; track option.value) {
                <button
                  type="button"
                  (click)="select(option)"
                  [disabled]="disabledValueSet().has(option.value)"
                  role="option"
                  [attr.aria-selected]="value() === option.value"
                  class="flex w-full items-center gap-2 rounded-xl px-2.5 py-2 text-left text-xs transition hover:bg-secondary/10 disabled:cursor-not-allowed disabled:opacity-35"
                  [class.bg-secondary/10]="value() === option.value"
                  [class.text-secondary]="value() === option.value"
                  [class.font-inter-semibold]="value() === option.value"
                >
                  <span
                    class="grid size-7 shrink-0 place-items-center rounded-lg bg-secondary/10 text-[0.65rem] text-secondary"
                  >
                    <i class="far fa-clock"></i>
                  </span>
                  <span class="min-w-0 flex-1 truncate">{{ option.timeLabel }}</span>
                  @if (value() === option.value) {
                    <i class="fas fa-check text-[0.65rem]"></i>
                  }
                </button>
              }
            </div>
          </section>
        }
      </div>
    </div>
  }
</div>
