<div class="space-y-6 font-inter-regular text-text">
  <div class="flex flex-col gap-2">
    <h1 class="text-3xl font-plus-jakarta-sans font-bold capitalize">mi perfil</h1>
    <p class="text-[0.82rem] text-muted">Actualiza tu informacion publica, foto y video de presentacion.</p>
  </div>

  @if (loading()) {
    <div class="py-16 text-center text-muted">
      <i class="fas fa-spinner fa-spin text-3xl text-secondary"></i>
    </div>
  } @else {
    <section class="grid grid-cols-1 gap-6 xl:grid-cols-[22rem_1fr]">
      <aside class="rounded-xl border border-border bg-surface p-6">
        <h2 class="mb-5 block text-xs font-inter-semibold text-muted">Foto de perfil y video</h2>
        <div class="mx-auto h-36 w-36 overflow-hidden rounded-full border border-border bg-text/5">
          @if (form().photoUrl) {
            <img [src]="form().photoUrl" alt="Foto de perfil" class="h-full w-full object-cover" />
          } @else {
            <div class="flex h-full w-full items-center justify-center text-4xl text-muted">
              <i class="fas fa-user-tie"></i>
            </div>
          }
        </div>
        <label class="mt-5 flex h-10 cursor-pointer items-center justify-center gap-2 rounded-xl border border-border text-sm font-inter-semibold">
          @if (uploadingPhoto()) {
            <i class="fas fa-spinner fa-spin"></i>
          } @else {
            <i class="fas fa-image"></i>
          }
          Subir foto
          <input type="file" accept="image/*" class="hidden" (change)="uploadPhoto($event)" />
        </label>
        <label class="mt-3 flex h-10 cursor-pointer items-center justify-center gap-2 rounded-xl border border-border text-sm font-inter-semibold">
          @if (uploadingVideo()) {
            <i class="fas fa-spinner fa-spin"></i>
          } @else {
            <i class="fas fa-video"></i>
          }
          Subir video
          <input type="file" accept="video/*" class="hidden" (change)="uploadVideo($event)" />
        </label>
        @if (form().videoUrl) {
          <video [src]="form().videoUrl" class="mt-4 aspect-video w-full rounded-xl border border-border object-cover" controls preload="metadata"></video>
        }
      </aside>

      <form (ngSubmit)="save()" class="rounded-xl border border-border bg-surface p-6 lg:p-8">
        <h2 class="mb-6 font-anton text-xl lowercase text-text">mi información personal</h2>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="block text-xs text-muted font-inter-semibold md:col-span-2">
            <span class="mb-2 block">Nombre publico</span>
            <input [ngModel]="form().name" name="consultantName" (ngModelChange)="updateForm('name', $event)" class="h-10 w-full rounded-xl border border-border bg-background px-3 text-sm text-text outline-none focus:border-secondary" />
          </label>
          <label class="block text-xs text-muted font-inter-semibold md:col-span-2">
            <span class="mb-2 block">Bio</span>
            <textarea [ngModel]="form().bio" name="bio" (ngModelChange)="updateForm('bio', $event)" class="min-h-28 w-full rounded-xl border border-border bg-background px-3 py-2 text-sm text-text outline-none focus:border-secondary"></textarea>
          </label>
          <label class="block text-xs text-muted font-inter-semibold">
            <span class="mb-2 block">Especialidades</span>
            <input [ngModel]="form().specialties" name="specialties" (ngModelChange)="updateForm('specialties', $event)" class="h-10 w-full rounded-xl border border-border bg-background px-3 text-sm text-text outline-none focus:border-secondary" />
          </label>
          <label class="block text-xs text-muted font-inter-semibold">
            <span class="mb-2 block">Sectores</span>
            <input [ngModel]="form().sectors" name="sectors" (ngModelChange)="updateForm('sectors', $event)" class="h-10 w-full rounded-xl border border-border bg-background px-3 text-sm text-text outline-none focus:border-secondary" />
          </label>
          <label class="block text-xs text-muted font-inter-semibold">
            <span class="mb-2 block">Precio por hora</span>
            <input type="number" [ngModel]="form().pricePerHour" name="pricePerHour" (ngModelChange)="updateForm('pricePerHour', +$event)" class="h-10 w-full rounded-xl border border-border bg-background px-3 text-sm text-text outline-none focus:border-secondary" />
          </label>
        </div>
        <div class="mt-6 flex justify-end">
          <button type="submit" [disabled]="saving()" class="h-10 rounded-xl bg-primary px-5 text-sm text-background font-inter-bold disabled:opacity-50">
            @if (saving()) {
              <i class="fas fa-spinner fa-spin mr-2"></i> Guardando...
            } @else {
              Guardar perfil
            }
          </button>
        </div>
      </form>
    </section>
  }
</div>
