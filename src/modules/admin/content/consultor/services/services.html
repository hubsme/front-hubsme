<div class="text-text">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="font-plus-jakarta-sans text-2xl font-bold leading-tight sm:text-3xl">Servicios</h1>
      <p class="mt-2 max-w-2xl text-sm leading-relaxed text-muted">
        Atiende solicitudes y publica soluciones que las PYMEs puedan contratar contigo.
      </p>
    </div>
    @if (store.activeTab() === 'offers') {
      <button
        type="button"
        (click)="store.openOfferForm()"
        class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-secondary px-5 text-sm font-inter-bold text-fixed-text-50 shadow-md shadow-secondary/20 transition hover:-translate-y-0.5 hover:bg-secondary/90"
      >
        <i class="fas fa-plus"></i> Publicar servicio
      </button>
    }
  </header>

  <div class="mt-7">
    <app-consultant-service-filters />
  </div>

  <div class="mt-8">
    @if (store.activeTab() === 'offers') {
      <app-consultant-service-offer-list />
    } @else {
      <app-consultant-service-list />
    }
  </div>
</div>

@if (store.showOfferForm()) {
  <app-consultant-service-offer-form
    [offer]="store.editingOffer()"
    (closed)="store.closeOfferForm()"
    (saved)="store.offerSaved()"
  />
}
