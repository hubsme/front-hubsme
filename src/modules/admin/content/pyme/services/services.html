<div class="text-text">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="font-plus-jakarta-sans text-2xl font-bold leading-tight sm:text-3xl">Servicios</h1>
      <p class="mt-2 max-w-2xl text-sm leading-relaxed text-muted">
        Solicita trabajos especializados, compara las cotizaciones recibidas y aprueba la mejor
        propuesta.
      </p>
    </div>
    <button
      type="button"
      (click)="store.openCreate()"
      class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-secondary px-5 text-sm font-inter-bold text-fixed-text-50 shadow-md shadow-secondary/20 transition hover:-translate-y-0.5 hover:bg-secondary/90"
    >
      <i class="fas fa-plus"></i>
      {{ store.activeTab() === 'catalog' ? 'Solicitud a medida' : 'Solicitar servicio' }}
    </button>
  </header>

  <div class="mt-7">
    <app-pyme-service-filters />
  </div>

  <div class="mt-8">
    @if (store.activeTab() === 'catalog') {
      <app-pyme-service-catalog />
    } @else {
      <app-pyme-service-list />
    }
  </div>
</div>

<app-pyme-request-service />
