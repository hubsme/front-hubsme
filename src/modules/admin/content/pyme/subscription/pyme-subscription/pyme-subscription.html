<div class="space-y-6">
  <div class="text-center max-w-2xl mx-auto">
    <h1 class="text-3xl font-inter-bold text-text">Suscripcion</h1>
    <p class="text-sm text-text/60 mt-2">Planes para escalar tu cartera de consultoria dentro de Hubsme.</p>
  </div>

  @if (loading()) {
  <div class="py-12 text-center text-text/50"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
  } @else {
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
    @for (plan of plans(); track plan.id) {
    <article
      class="rounded-xl border p-5 bg-background flex flex-col"
      [class.border-primary]="selectedPlan() === plan.id"
      [class.shadow-lg]="selectedPlan() === plan.id"
      [class.border-text\/10]="selectedPlan() !== plan.id"
    >
      <div>
        <p class="text-sm text-primary font-inter-bold uppercase">{{ plan.name }}</p>
        <div class="flex items-end gap-1 mt-3">
          <span class="text-4xl font-inter-bold">S/ {{ plan.price }}</span>
          <span class="text-sm text-text/50 mb-1">/mes</span>
        </div>
        <p class="text-sm text-text/60 mt-3 min-h-12">{{ plan.description }}</p>
      </div>
      <ul class="space-y-3 my-6 flex-1">
        @for (feature of plan.features; track feature) {
        <li class="flex items-start gap-2 text-sm">
          <i class="fas fa-check text-success mt-1"></i>
          <span>{{ feature }}</span>
        </li>
        }
      </ul>
      <button
        (click)="choose(plan)"
        class="w-full py-3 rounded-lg font-inter-bold"
        [class.bg-primary]="selectedPlan() !== plan.id"
        [class.text-background]="selectedPlan() !== plan.id"
        [class.bg-success\/10]="selectedPlan() === plan.id"
        [class.text-success]="selectedPlan() === plan.id"
      >
        {{ selectedPlan() === plan.id ? 'Seleccionado' : 'Elegir plan' }}
      </button>
    </article>
    }
  </div>
  }
</div>
