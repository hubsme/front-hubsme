<div
  class="h-20 px-4 sm:px-6 md:px-8 flex items-center justify-between bg-surface gap-2 sm:gap-4 border-b border-border shadow-[0_1px_2px_rgba(15,23,42,0.04)]"
>
  <div class="flex items-center gap-4">
    <div class="md:hidden flex items-center gap-2 mr-2">
      <div class="w-9 h-9 rounded-xl bg-slate-950 text-white flex items-center justify-center">
        <i class="fas fa-brain text-sm"></i>
      </div>
      <span class="text-slate-950 text-2xl font-inter-bold tracking-tight">HUBSME</span>
    </div>

    <div
      (click)="onToggleSidebar()"
      class="md:hidden h-10 w-10 rounded-full flex items-center justify-center text-muted hover:text-slate-950 hover:bg-slate-100 cursor-pointer"
      title="Colapsar/Expandir menú"
    >
      <i class="fas fa-bars text-xl"></i>
    </div>

    <div
      (click)="onToggleCollapse()"
      class="hidden md:flex h-10 w-10 rounded-full items-center justify-center text-muted hover:text-slate-950 hover:bg-slate-100 cursor-pointer"
      title="Colapsar/Expandir menú"
    >
      <i class="fas fa-bars text-xl"></i>
    </div>
  </div>
  <div class="flex items-center gap-2 sm:gap-4">
    <nav class="hidden lg:flex items-center gap-8 text-sm font-inter-semibold text-muted">
      <button (click)="goToLanding('quienes-somos')" class="hover:text-slate-950">Quienes Somos</button>
      <button (click)="goToLanding('servicios')" class="hover:text-slate-950">Servicios</button>
      <button (click)="goToLanding('consultores')" class="hover:text-slate-950">Consultores</button>
    </nav>

    <div class="relative">
      <div
        (click)="onToggleDropdown()"
        class="flex items-center gap-3 pl-2 sm:pl-5 sm:border-l border-border select-none cursor-pointer"
      >
        <div class="text-right hidden sm:block">
          <div class="text-sm font-inter-semibold text-text capitalize whitespace-nowrap">
            {{ userName() }}
          </div>
          <div class="text-xs text-muted font-inter-medium capitalize">{{ userRole() }}</div>
        </div>
        <div
          class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-950 font-inter-bold border border-border shadow-sm"
        >
          {{ userInitials() }}
        </div>
      </div>

      @if (isDropdownOpen()) {
      <div class="fixed inset-0 z-40" (click)="onToggleDropdown()"></div>
      <div
        class="absolute right-0 top-full mt-2 w-52 bg-surface rounded-2xl shadow-xl border border-border overflow-hidden z-50 flex flex-col py-1 animate-in fade-in slide-in-from-top-2 duration-200"
      >
        <div class="px-4 py-3 border-b border-border block sm:hidden">
          <p class="text-sm font-inter-bold text-text truncate">{{ userName() }}</p>
          <p class="text-xs text-muted capitalize">{{ userRole() }}</p>
        </div>

        <button
          (click)="goToLanding('quienes-somos')"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium text-text hover:bg-slate-50 flex items-center gap-3 lg:hidden"
        >
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-muted">
            <i class="fas fa-circle-info text-xs"></i>
          </div>
          <span class="leading-tight">Quienes Somos</span>
        </button>

        <button
          (click)="goToLanding('servicios')"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium text-text hover:bg-slate-50 flex items-center gap-3 lg:hidden"
        >
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-muted">
            <i class="fas fa-briefcase text-xs"></i>
          </div>
          <span class="leading-tight">Servicios</span>
        </button>

        <button
          (click)="goToLanding('consultores')"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium text-text hover:bg-slate-50 flex items-center gap-3 lg:hidden"
        >
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-muted">
            <i class="fas fa-users text-xs"></i>
          </div>
          <span class="leading-tight">Consultores</span>
        </button>

        <button
          (click)="toggleTheme()"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium text-text hover:bg-slate-50 flex items-center gap-3"
        >
          @if (themeService.theme() === 'dark') {
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-muted">
            <i class="fas fa-sun text-xs"></i>
          </div>
          <span class="leading-tight">Modo Claro</span>
          } @else {
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-muted">
            <i class="fas fa-moon text-xs"></i>
          </div>
          <span class="leading-tight">Modo Oscuro</span>
          }
        </button>

        <button
          (click)="logout()"
          class="w-full px-4 py-2 text-left text-xs font-inter-medium text-danger hover:bg-danger/5 flex items-center gap-3 border-t border-border"
        >
          <div class="w-7 h-7 rounded-lg flex items-center justify-center text-danger">
            <i class="fas fa-sign-out-alt text-xs"></i>
          </div>
          <span class="leading-tight">Cerrar Sesion</span>
        </button>
      </div>
      }
    </div>
  </div>
</div>
