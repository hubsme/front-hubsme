@if (isOpen()) {
<div
  class="fixed inset-0 bg-black/50 z-30 md:hidden transition-opacity"
  (click)="closeSidebar()"
></div>
}

<div
  class="flex flex-col bg-surface text-text md:translate-x-0 fixed md:relative z-40 w-64 h-full border-r border-border shadow-[0_1px_3px_rgba(15,23,42,0.05)]"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.md:!w-20]="isCollapsed()"
>
  <div
    class="flex flex-col items-center border-text/10 justify-center"
    [class.py-8]="!isCollapsed()"
    [class.h-16]="isCollapsed()"
    [class.border-b]="isCollapsed()"
    [class.px-4]="!isCollapsed()"
    [class.px-2]="isCollapsed()"
  >
    <div class="flex flex-col items-center gap-0 overflow-hidden w-full">
      @if (isCollapsed()) {
      <div class="w-10 h-10 rounded-xl bg-slate-950 text-white flex items-center justify-center">
        <i class="fas fa-brain"></i>
      </div>
      } @else {
      <div class="flex items-center gap-3 py-2">
        <div class="w-12 h-12 rounded-2xl bg-slate-950 text-white flex items-center justify-center shadow-sm">
          <i class="fas fa-brain text-xl"></i>
        </div>
        <div class="flex flex-col leading-tight">
          <span class="text-2xl font-inter-bold tracking-tight text-slate-950">HUBSME</span>
          <span class="text-xs font-inter-medium text-muted">consulting hub</span>
        </div>
      </div>
      }
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1 overflow-hidden">
    @if (!isCollapsed()) {
    <div class="px-3 mb-3 text-xs font-inter-bold text-muted uppercase tracking-[0.2em]">Menu</div>
    } @for (item of menuItems(); track item.label) {
    <button
      (click)="navigateTo(item.path)"
      [title]="isCollapsed() ? item.label : ''"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl duration-200 group overflow-hidden text-left"
      [class.bg-slate-950]="isActive(item.path)"
      [class.text-white]="isActive(item.path)"
      [class.shadow-[0_12px_30px_rgba(15,23,42,0.16)]]="isActive(item.path)"
      [class.text-muted]="!isActive(item.path)"
      [class.hover:bg-slate-100]="!isActive(item.path)"
      [class.hover:text-text]="!isActive(item.path)"
      [class.justify-center]="isCollapsed()"
    >
      <i
        [class]="
          item.icon +
          ' w-5 text-center shrink-0 ' +
          (isActive(item.path) ? 'text-white' : 'group-hover:text-slate-950')
        "
      ></i>
      @if (!isCollapsed()) {
      <span class="text-sm font-inter-semibold truncate">{{ item.label }}</span>
      }
    </button>
    }
  </nav>

  <div class="px-4 py-3 border-t border-text/10">
    <button
      (click)="logout()"
      [title]="isCollapsed() ? 'Cerrar sesion' : ''"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-muted hover:bg-danger/8 hover:text-danger duration-200 overflow-hidden"
      [class.justify-center]="isCollapsed()"
    >
      <i class="fas fa-sign-out-alt w-5 text-center shrink-0"></i>
      @if (!isCollapsed()) {
      <span class="text-sm font-inter-medium truncate">Cerrar sesion</span>
      }
    </button>
  </div>
</div>
