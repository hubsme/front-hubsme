@if (isOpen()) {
<div
  class="fixed inset-0 bg-text-950/50 z-30 md:hidden transition-opacity"
  (click)="closeSidebar()"
></div>
}

<div
  class="flex flex-col bg-surface text-text md:translate-x-0 fixed md:relative z-40 w-64 h-full border-r border-border shadow-[0_1px_3px_rgba(15,23,42,0.05)]"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.md:!w-20]="isCollapsed()"
>
  <div
    class="flex flex-col items-center border-text/10 justify-center"
    [class.py-8]="!isCollapsed()"
    [class.h-20]="isCollapsed()"
    [class.border-b]="isCollapsed()"
    [class.px-4]="!isCollapsed()"
    [class.px-2]="isCollapsed()"
  >
    <div class="flex flex-col items-center gap-0 overflow-hidden w-full cursor-pointer" (click)="navigateTo('/')">
      @if (isCollapsed()) {
      <div class="w-10 h-10 flex items-center justify-center">
        <img
          src="/avif/icono.avif"
          alt="HUBSME"
          class="w-8 h-8 object-contain"
          [class.brightness-0]="themeService.theme() === 'dark'"
          [class.invert]="themeService.theme() === 'dark'"
        />
      </div>
      } @else {
      <div class="flex items-center py-2 px-1">
        <img
          src="/avif/logo_completo.avif"
          alt="HUBSME"
          class="h-9 w-auto"
          [class.brightness-0]="themeService.theme() === 'dark'"
          [class.invert]="themeService.theme() === 'dark'"
        />
      </div>
      }
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1 overflow-hidden">
    @if (!isCollapsed()) {
    <div class="px-3 mb-3 text-xs font-inter-bold text-muted uppercase tracking-[0.2em]">Menu</div>
    } @for (item of menuItems(); track item.label) {
    <button
      (click)="navigateTo(item.path)"
      [title]="isCollapsed() ? item.label : ''"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl duration-200 group overflow-hidden text-left transition-colors"
      [class.bg-primary]="isActive(item.path)"
      [class.text-fixed-background-50]="isActive(item.path)"
      [class.shadow-md]="isActive(item.path)"
      [class.shadow-primary/30]="isActive(item.path)"
      [class.text-muted]="!isActive(item.path)"
      [class.hover:bg-primary/10]="!isActive(item.path)"
      [class.hover:text-primary]="!isActive(item.path)"
      [class.justify-center]="isCollapsed()"
    >
      <i
        [class]="
          item.icon +
          ' w-5 text-center shrink-0 transition-colors duration-200 ' +
          (isActive(item.path) ? 'text-fixed-background-50' : 'group-hover:text-primary')
        "
      ></i>
      @if (!isCollapsed()) {
      <span class="text-sm font-inter-semibold truncate">{{ item.label }}</span>
      }
    </button>
    }
  </nav>

  <div class="px-4 py-3 border-t border-text/10">
    <button
      (click)="logout()"
      [title]="isCollapsed() ? 'Cerrar sesion' : ''"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-muted hover:bg-danger/8 hover:text-danger duration-200 overflow-hidden"
      [class.justify-center]="isCollapsed()"
    >
      <i class="fas fa-sign-out-alt w-5 text-center shrink-0"></i>
      @if (!isCollapsed()) {
      <span class="text-sm font-inter-medium truncate">Cerrar sesion</span>
      }
    </button>
  </div>
</div>
