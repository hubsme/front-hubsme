<div class="min-h-screen flex items-center justify-center bg-background p-4 font-inter-regular text-text">
  <div class="w-full max-w-md bg-background rounded-2xl shadow-lg border border-text/10 overflow-hidden">
    <div class="pt-8 pb-4 text-center">
      <div
        class="mx-auto w-16 h-16 rounded-2xl bg-primary text-background flex items-center justify-center shadow-sm"
      >
        <i class="fas fa-brain text-2xl"></i>
      </div>
      <h1 class="mt-4 text-3xl font-inter-bold text-primary tracking-tight">HUBSME</h1>
      <p class="text-sm text-text/50 font-inter-medium">Panel de consultoria para PYMEs</p>
    </div>

    <div class="p-8 pt-4">
      <form (ngSubmit)="onLogin()" class="space-y-5">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-inter-semibold text-text/60">Email</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-text/40"></i>
            <input
              type="email"
              id="email"
              name="email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              required
              class="block w-full pl-10 pr-3 py-2.5 border border-text/20 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none bg-background text-text"
              placeholder="admin@hubsme.com"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-inter-semibold text-text/60">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-text/40"></i>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              required
              class="block w-full pl-10 pr-10 py-2.5 border border-text/20 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none bg-background text-text"
              placeholder="123456"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-text/40 hover:text-primary"
            >
              <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-inter-bold text-background bg-primary hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (loading()) {
          <i class="fas fa-circle-notch fa-spin mr-2"></i> Ingresando... } @else { Ingresar }
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-text/60">
        Aun no tienes cuenta?
        <button type="button" (click)="goToSignUp()" class="font-inter-bold text-primary hover:underline">
          Crear cuenta
        </button>
      </div>
    </div>
  </div>
</div>
