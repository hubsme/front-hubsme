<div class="min-h-screen flex items-center justify-center bg-background p-4 font-inter-regular text-text">
  <div class="w-full max-w-lg bg-background rounded-2xl shadow-lg border border-text/10 overflow-hidden">
    <div class="pt-12 pb-4 text-center">
      <img src="/avif/logo_completo.avif" alt="HUBSME" class="mx-auto h-12 w-auto" />
    </div>

    <div class="p-10">
      <form (ngSubmit)="onRegister()" class="space-y-5">
        @if (!roleLocked()) {
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            (click)="setRole('pyme')"
            class="rounded-lg border px-4 py-3 text-left"
            [class.border-secondary]="role() === 'pyme'"
            [class.bg-secondary/5]="role() === 'pyme'"
          >
            <i class="fas fa-building text-secondary"></i>
            <p class="font-inter-bold text-sm mt-2">Soy PYME</p>
            <p class="text-xs text-text/50">Busco diagnostico y consultoria.</p>
          </button>
          <button
            type="button"
            (click)="setRole('consultor')"
            class="rounded-lg border px-4 py-3 text-left"
            [class.border-secondary]="role() === 'consultor'"
            [class.bg-secondary/5]="role() === 'consultor'"
          >
            <i class="fas fa-user-tie text-secondary"></i>
            <p class="font-inter-bold text-sm mt-2">Soy consultor</p>
            <p class="text-xs text-text/50">Gestiono clientes y sesiones.</p>
          </button>
        </div>
        } @else {
          <div class="rounded-xl border border-secondary/20 bg-secondary/5 p-4">
            <div class="flex items-center gap-3">
              <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-secondary text-background">
                <i class="fas" [class.fa-user-tie]="role() === 'consultor'" [class.fa-building]="role() === 'pyme'"></i>
              </div>
              <div>
                <p class="text-sm font-inter-bold text-secondary">
                  {{ role() === 'consultor' ? 'Registro para consultor' : 'Registro para PYME' }}
                </p>
                <p class="text-xs text-text/50">
                  Este perfil ya viene seleccionado desde la landing.
                </p>
              </div>
            </div>
          </div>
        }

        <div class="space-y-2">
          <label class="mb-2 block text-sm font-inter-semibold text-text/60">Nombre</label>
          <input
            name="name"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            class="block w-full px-3 py-2.5 border border-text/20 rounded-lg focus:ring-2 focus:ring-secondary/30 focus:border-secondary outline-none bg-background text-text placeholder:text-text-400"
            placeholder="Textiles del Sur SAC"
          />
        </div>

        <div class="space-y-2">
          <label class="mb-2 block text-sm font-inter-semibold text-text/60">Email</label>
          <input
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            class="block w-full px-3 py-2.5 border border-text/20 rounded-lg focus:ring-2 focus:ring-secondary/30 focus:border-secondary outline-none bg-background text-text placeholder:text-text-400"
            placeholder="hola@empresa.com"
          />
        </div>

        <div class="space-y-2">
          <label class="mb-2 block text-sm font-inter-semibold text-text/60">Password</label>
          <input
            type="password"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            class="block w-full px-3 py-2.5 border border-text/20 rounded-lg focus:ring-2 focus:ring-secondary/30 focus:border-secondary outline-none bg-background text-text placeholder:text-text-400"
            placeholder="Minimo 6 caracteres"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-inter-bold text-background bg-secondary hover:bg-secondary/90 disabled:opacity-50"
        >
          @if (loading()) {
          <i class="fas fa-circle-notch fa-spin mr-2"></i> Creando... } @else { Crear cuenta }
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-text/60">
        Ya tienes cuenta?
        <button type="button" (click)="goToSignIn()" class="font-inter-bold text-secondary hover:underline">
          Ingresar
        </button>
      </div>
    </div>
  </div>
</div>
