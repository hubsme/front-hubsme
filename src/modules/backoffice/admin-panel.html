<div class="min-h-screen bg-background-50 text-text">
  <header class="h-16 bg-surface border-b border-border sticky top-0 z-30">
    <div class="max-w-7xl mx-auto h-full px-5 flex items-center justify-between gap-4">
      <a href="/" aria-label="Ir al inicio de Hubsme">
        <img src="/avif/logo_completo.avif" alt="Hubsme" class="h-8 w-auto" />
      </a>
      <nav class="flex items-center gap-2">
        <a
          [routerLink]="promotionCodesPath"
          class="hidden sm:inline-flex items-center gap-2 px-3 h-9 rounded-lg text-sm font-inter-semibold text-secondary bg-secondary/10"
        >
          <i class="fas fa-ticket"></i>
          Códigos
        </a>
        <span class="hidden md:block text-sm text-muted px-2">{{ username }}</span>
        <button
          type="button"
          (click)="logout()"
          class="size-9 rounded-lg border border-border text-muted hover:text-danger hover:border-danger/40"
          title="Cerrar sesión"
        >
          <i class="fas fa-right-from-bracket"></i>
        </button>
      </nav>
    </div>
  </header>

  <router-outlet />
</div>
