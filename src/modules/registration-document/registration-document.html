<div class="min-h-screen bg-background-50 font-plus-jakarta-sans text-text">
  <header class="border-b border-border bg-surface">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-6 py-5">
      <a [routerLink]="homePath" aria-label="Ir al inicio de HUBSME">
        <img
          src="/avif/logo_completo.avif"
          alt="HUBSME"
          class="h-10 w-auto dark:brightness-0 dark:invert"
        />
      </a>
      <a
        [routerLink]="homePath"
        aria-label="Volver al inicio de HUBSME"
        class="rounded-full border border-border bg-surface px-4 py-2 font-inter-bold text-sm text-text transition hover:bg-background-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
      >
        Volver
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-12 lg:py-16">
    <header class="rounded-3xl border border-border bg-surface p-6 shadow-sm lg:p-10">
      <p class="font-inter-bold text-sm uppercase tracking-wide text-primary">HUBSME</p>
      <div class="mt-3 font-inter-bold text-3xl leading-tight sm:text-4xl">
        <ng-content select="[contract-title]" />
      </div>
      <div class="mt-4 max-w-3xl text-sm leading-7 text-text-600 [&_strong]:text-text">
        <ng-content select="[contract-intro]" />
      </div>
    </header>

    <article class="mt-8 grid min-w-0 gap-6">
      <ng-content select="[appRegistrationClause]" />
      <ng-content select="footer" />
    </article>
  </main>
</div>
